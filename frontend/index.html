<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Moments-like 微信式资料与朋友圈</title>
    <link rel="stylesheet" href="./styles.css?v=20260826-1735" />
  </head>
  <body>
    <main class="shell" id="appShell">
      <aside class="sidebar">
        <section class="brand">
          <img class="brand-mark" src="./assets/app-icon.png" alt="Moments-like 图标" />
          <div class="brand-copy">
            <h1>Moments-like</h1>
            <p>个人资料与聊天记录管理系统</p>
          </div>
          <button class="sidebar-toggle" id="sidebarToggle" title="折叠/展开侧栏" aria-label="折叠或展开侧栏">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 6l-6 6 6 6" />
            </svg>
          </button>
        </section>

        <section class="login-panel" id="loginPanel">
          <label>账号</label>
          <input id="loginWechatId" value="u001" autocomplete="username" />
          <label>密码</label>
          <input id="loginPassword" type="password" value="123456" autocomplete="current-password" />
          <button id="loginBtn">登录</button>
        </section>

        <section class="user-card hidden" id="userCard">
          <div class="avatar" id="avatar">U</div>
          <div class="user-copy">
            <strong id="nickname">未登录</strong>
            <span id="wechatId"></span>
          </div>
          <div class="user-actions">
            <button class="user-link" data-tab="profile" title="资料">资料</button>
            <button class="user-link" id="logoutBtn">退出</button>
          </div>
        </section>

        <nav class="tabs">
          <button class="active" data-tab="moments" data-title="朋友圈" title="朋友圈">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M8 12h8" /><path d="M12 8v8" /></svg>
            </span>
            <span class="nav-label">朋友圈</span>
          </button>
          <button data-tab="chat" data-title="聊天" title="聊天">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z" /></svg>
            </span>
            <span class="nav-label">聊天</span>
          </button>
          <button data-tab="friends" data-title="好友" title="好友">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></svg>
            </span>
            <span class="nav-label">好友</span>
          </button>
          <button data-tab="stats" data-title="统计" title="统计">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 19V5" /><path d="M4 19h16" /><path d="M8 16v-5" /><path d="M12 16V8" /><path d="M16 16v-3" /></svg>
            </span>
            <span class="nav-label">统计</span>
          </button>
        </nav>
      </aside>

      <section class="content">
        <header class="topbar">
          <div>
            <h2 id="pageTitle">朋友圈</h2>
            <p id="statusText">后端 API：http://127.0.0.1:5000</p>
          </div>
          <div class="topbar-actions">
            <button class="icon-button primary" id="toggleComposerBtn" title="发布朋友圈" aria-label="发布朋友圈">+</button>
          </div>
        </header>

        <section class="view" id="profile">
          <div class="profile-layout">
            <div class="profile-hero">
              <div class="profile-avatar" id="profileAvatar">U</div>
              <div class="profile-identity">
                <span class="meta" id="profileModeText">个人资料</span>
                <h3 id="profileDisplayName">未登录</h3>
                <p id="profileSignatureText">暂无个性签名</p>
              </div>
              <div class="profile-actions">
                <button class="secondary hidden" id="profileChatBtn">发消息</button>
                <button class="ghost" id="profileMomentsBtn">ta 的朋友圈</button>
              </div>
            </div>
            <div class="profile-info-grid" id="profileInfoGrid"></div>
            <div class="profile-editor" id="profileEditor">
              <div class="section-head">
                <h3>编辑资料</h3>
                <button class="secondary" id="saveProfileBtn">保存</button>
              </div>
              <div class="form-grid">
                <label>昵称<input id="profileNickname" /></label>
                <label>性别
                  <select id="profileGender">
                    <option value="unknown">unknown</option>
                    <option value="male">male</option>
                    <option value="female">female</option>
                  </select>
                </label>
                <label>地区<input id="profileRegion" /></label>
                <label>手机号<input id="profilePhone" disabled /></label>
                <label class="wide">个性签名<input id="profileSignature" /></label>
              </div>
            </div>
            <div class="profile-moments">
              <div class="section-head">
                <h3 id="profileMomentsTitle">个人朋友圈</h3>
              </div>
              <div class="feed compact-feed" id="profileMomentList"></div>
            </div>
          </div>
        </section>

        <section class="view" id="friends">
          <div class="friends-shell">
            <div class="friends-list-pane">
              <div class="friend-tools">
                <div class="friend-tools-row">
                  <div class="soft-filters" aria-label="好友筛选">
                    <button class="active" id="showAllFriendsBtn" data-friend-filter="all">全部</button>
                    <button id="showStarredFriendsBtn" data-friend-filter="starred">星标</button>
                    <button id="loadRequestsBtn" data-friend-filter="requests">申请</button>
                  </div>
                  <button class="icon-button add-friend-button" id="openAddFriendBtn" title="添加好友" aria-label="添加好友">+</button>
                </div>
              </div>
              <div class="list friend-list" id="friendList"></div>
            </div>
            <div class="friend-detail-pane" id="friendDetailPane">
              <div class="friend-detail-empty" id="friendDetailEmpty">选择一位好友查看资料和聊天</div>
              <div class="friend-detail hidden" id="friendDetail">
                <div class="mini-profile">
                  <div class="friend-avatar large" id="friendDetailAvatar">U</div>
                  <div>
                    <h3 id="friendDetailName">好友</h3>
                    <p class="meta" id="friendDetailMeta"></p>
                    <p id="friendDetailSignature"></p>
                  </div>
                  <div class="mini-actions">
                    <button class="ghost" id="friendProfileBtn">资料</button>
                    <button class="ghost" id="friendMomentsBtn">朋友圈</button>
                    <button class="ghost" id="friendManageBtn">管理</button>
                  </div>
                </div>
                <div class="friend-last-moment" id="friendLastMoment"></div>
                <div class="permission-panel hidden" id="friendPermissionPanel"></div>
                <div class="mini-chat">
                  <div class="section-head">
                    <h3>聊天</h3>
                    <button class="ghost" id="openFullChatBtn">打开完整聊天</button>
                  </div>
                  <div class="message-box mini-message-box" id="miniMessageList"></div>
                  <div class="send-row mini-send-row">
                    <input id="miniMessageContent" placeholder="输入消息" />
                    <button id="miniSendMessageBtn">发送</button>
                  </div>
                </div>
              </div>
              <div class="friend-aux-drawer hidden" id="friendAuxPanel">
                <div class="drawer-head">
                  <h3 id="friendAuxTitle">搜索结果</h3>
                  <button class="icon-button ghost" id="closeFriendAuxBtn" title="关闭" aria-label="关闭">×</button>
                </div>
                <div class="friend-search hidden" id="friendSearchPanel">
                  <input id="searchKeyword" placeholder="输入账号或手机号" />
                  <button id="searchUserBtn">搜索</button>
                  <p class="drawer-hint">只支持通过账号或手机号查找非好友。</p>
                </div>
                <div class="list" id="userList"></div>
              </div>
            </div>
          </div>
        </section>

        <section class="view" id="chat">
          <div class="split chat-layout">
            <div>
              <h3>会话</h3>
              <div class="list" id="conversationList"></div>
            </div>
            <div>
              <h3 id="chatPeerTitle">消息</h3>
              <div class="message-box" id="messageList"></div>
              <div class="send-row">
                <input id="messageContent" placeholder="输入消息内容" />
                <button class="icon-button ghost" id="openHistoryBtn" title="检索聊天记录" aria-label="检索聊天记录">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7" /><path d="M3 4v5h5" /><path d="M12 7v5l3 2" /></svg>
                </button>
                <button id="sendMessageBtn">发送</button>
              </div>
            </div>
          </div>
          <aside class="history-drawer hidden" id="historyDrawer" aria-label="聊天记录检索">
            <div class="drawer-head">
              <div>
                <h3>聊天记录</h3>
                <span class="meta" id="historyConversationTitle">当前会话</span>
              </div>
              <button class="icon-button ghost" id="closeHistoryBtn" title="关闭" aria-label="关闭聊天记录检索">×</button>
            </div>
            <div class="drawer-search">
              <input id="messageKeyword" placeholder="搜索当前会话" />
              <button id="searchMessagesBtn">搜索</button>
            </div>
            <div class="history-results" id="historyResults">
              <div class="drawer-hint">输入关键词后，结果会直接显示在这里。</div>
            </div>
          </aside>
        </section>

        <section class="view active" id="moments">
          <div class="composer hidden" id="momentComposer">
            <div class="composer-head">
              <h3>发布朋友圈</h3>
              <button class="icon-button ghost" id="closeComposerBtn" title="收起" aria-label="收起发布面板">×</button>
            </div>
            <textarea id="momentContent" placeholder="这一刻的想法..."></textarea>
            <label class="upload-box">
              <span>朋友圈图片</span>
              <input id="momentImages" type="file" accept="image/*" multiple />
            </label>
            <div class="image-preview" id="momentPreview"></div>
            <div class="toolbar">
              <select id="momentVisibility">
                <option value="friends">仅朋友</option>
                <option value="public">公开</option>
                <option value="private">私密</option>
                <option value="selected">指定可见</option>
              </select>
              <input id="momentLocation" placeholder="位置" />
              <button id="publishMomentBtn">发布</button>
            </div>
          </div>
          <div class="feed" id="momentList"></div>
        </section>

        <section class="view" id="stats">
          <div class="stat-grid">
            <button data-stat="messages">用户消息量排行</button>
            <button data-stat="moments">朋友圈互动排行</button>
            <button data-stat="permissions">朋友权限统计</button>
            <button data-stat="conversations">会话活跃度</button>
          </div>
          <div class="table-wrap">
            <table id="statsTable"></table>
          </div>
        </section>
      </section>
    </main>
    <div class="toast" id="toast"></div>
    <div class="image-viewer hidden" id="imageViewer" aria-modal="true" role="dialog">
      <button class="viewer-close" id="viewerCloseBtn" title="关闭" aria-label="关闭大图">×</button>
      <button class="viewer-nav viewer-prev" id="viewerPrevBtn" title="上一张" aria-label="上一张">‹</button>
      <figure class="viewer-stage">
        <img id="viewerImage" alt="朋友圈大图" />
        <figcaption>
          <strong id="viewerAuthor"></strong>
          <span id="viewerCaption"></span>
          <em id="viewerCounter"></em>
        </figcaption>
      </figure>
      <button class="viewer-nav viewer-next" id="viewerNextBtn" title="下一张" aria-label="下一张">›</button>
    </div>
    <script src="./app.js?v=20260826-1735"></script>
  </body>
</html>
